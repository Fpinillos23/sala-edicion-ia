name: Departamento de Fotografía

# Apps Script despierta este flujo con un "repository_dispatch" y solo envía el número de misión.
# Los datos se piden al Apps Script con la clave secreta; nada sensible queda en los registros (que son públicos).
on:
  repository_dispatch:
    types: [seleccionar_fotos, editar_fotos]

concurrency:
  group: fotos-${{ github.event.client_payload.mision_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISION_ID: ${{ github.event.client_payload.mision_id }}
      SALA_API: ${{ secrets.SALA_API }}
      SALA_CLAVE: ${{ secrets.SALA_CLAVE }}
      TELEGRAM_TOKEN_FOTOS: ${{ secrets.TELEGRAM_TOKEN_FOTOS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODELO_GEMINI: ${{ vars.MODELO_GEMINI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: operador/requirements-fotos.txt

      - name: Preparar herramientas (tipografías y librerías de imagen)
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Acquire::Retries=3 fonts-liberation > /dev/null
          pip install -q -r operador/requirements-fotos.txt

      - name: Clay Spenser selecciona
        if: github.event.action == 'seleccionar_fotos'
        working-directory: operador
        run: python clay.py "$MISION_ID"

      - name: Brock Reynolds edita y Eric Blackburn revisa
        if: github.event.action == 'editar_fotos'
        working-directory: operador
        run: python brock.py "$MISION_ID"
